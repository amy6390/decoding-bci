[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "decoding_bci"
version = "0.0.1"
description = "A ML project to predict direction of motor movement from neuron firing data"
authors = [
  { name = "Amy" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.10.0"


[tool.ruff]
line-length = 99
src = ["decoding_bci"]
include = ["pyproject.toml", "decoding_bci/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["decoding_bci"]
force-sort-within-sections = true

